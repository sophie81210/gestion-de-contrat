<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Notice — App Gestion de contrat</title>
    <style>
  :root{
    --m:#6B4C3B;--m2:#9B7264;--mp:#f5ede8;--mb:#d4b8ad;
    --tx:#3a2218;--tx2:#7a5c50;--tx3:#b09080;
    --r:12px;--rs:8px;
  }
  body{
    font-family:Calibri,'Segoe UI',sans-serif;
    color:var(--tx);
    background:linear-gradient(to bottom, #fcf6f2 0%, #ebddd3 100%);
    min-height:100vh;
    margin:0;
    padding:20px;
  }
  h1{color:var(--m);font-style:italic;}
  h2{color:var(--m);border-bottom:1px solid var(--mb);padding-bottom:4px;margin-top:32px;}
  h3{color:var(--tx2);margin-top:20px;}
  a{color:var(--m);}
  p{line-height:1.6;color:var(--tx);}
    </style>
</head>
<body>
<h2 id="archives">Archives</h2>
  <p></p>
  <p >Dans cet onglet se trouve tous les contrats qui ont été archivés. <br>
Lors de l'archivage les feuilles de présence des mois après rupture et agendas futurs sont supprimés.<br>
Un clic sur le dossier ouvert permet de le déplacer dans l'onglet &quot;Contrats&quot;, il est alors désarchivé.</p>
</body>
</html>
